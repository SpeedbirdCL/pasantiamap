<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3f2"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="globeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4281a"/>
      <stop offset="100%" stop-color="#a01c10"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Logo + name -->
  <text x="80" y="120" font-family="-apple-system, system-ui, sans-serif" font-size="36" font-weight="800" fill="#0f172a" letter-spacing="-1">
    <tspan fill="#d4281a">Mi</tspan>Pasantía
  </text>

  <!-- Main title -->
  <text x="80" y="290" font-family="-apple-system, system-ui, sans-serif" font-size="92" font-weight="800" fill="#0f172a" letter-spacing="-3">Tu próxima</text>
  <text x="80" y="395" font-family="-apple-system, system-ui, sans-serif" font-size="92" font-weight="800" letter-spacing="-3">
    <tspan fill="#d4281a">pasantía</tspan>
    <tspan fill="#0f172a"> te está</tspan>
  </text>
  <text x="80" y="500" font-family="-apple-system, system-ui, sans-serif" font-size="92" font-weight="800" fill="#0f172a" letter-spacing="-3">esperando.</text>

  <!-- Bottom badge -->
  <rect x="80" y="540" width="360" height="44" rx="22" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="105" cy="562" r="5" fill="#16a34a"/>
  <text x="125" y="568" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#16a34a">Chile · LATAM · España</text>

  <!-- Stylized globe on the right -->
  <g transform="translate(1010, 130)">
    <circle cx="60" cy="60" r="60" fill="url(#globeFill)"/>
    <!-- meridian lines -->
    <ellipse cx="60" cy="60" rx="60" ry="22" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <ellipse cx="60" cy="60" rx="60" ry="40" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <ellipse cx="60" cy="60" rx="22" ry="60" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <ellipse cx="60" cy="60" rx="40" ry="60" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <line x1="60" y1="0" x2="60" y2="120" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Small dot for Chile -->
    <circle cx="40" cy="78" r="4" fill="#16a34a"/>
  </g>
</svg>
